<canvas id="c" role="img" aria-label="Proof of Work motion study: genesis block, mempool to block, options whale flow, FP&A waterfall, git merge graph, and the Bortlesboat signature."></canvas>
<div class="bar bottom"><span>Rendered live in your browser · canvas 2D · no video file</span><span>Figures are illustrative · space to pause · R to replay</span></div>
<div id="fps"></div>
<script>
// ─────────────────────────────────────────────────────────────
//  PROOF OF WORK: a 15s motion reel rendered 100% in canvas code
//  ?render=1 → deterministic frame renderer (driven by capture.js)
//  default   → live playback (?debug shows fps / p99.9 frame time)
// ─────────────────────────────────────────────────────────────
const W = 1920, H = 1080, FPS = 60, DUR = 15;
const RENDER = new URLSearchParams(location.search).has('render');
const SUB = RENDER ? 4 : 1;             // motion-blur subframes
const SHUTTER = 0.5 / FPS;              // 180° shutter
const DISP = "'Space Grotesk', Bahnschrift, sans-serif";
const MONO = "'JetBrains Mono', Consolas, monospace";
const C = { bg:'#06070a', or:'#F7931A', cy:'#35E8FF', gr:'#22E39A', rd:'#FF4769', vi:'#A371F7', wh:'#EEF1F6' };

const cv = document.getElementById('c'); cv.width = W; cv.height = H;
const out = cv.getContext('2d');
const buf = document.createElement('canvas'); buf.width = W; buf.height = H;
const bctx = buf.getContext('2d');
const tmp = document.createElement('canvas'); tmp.width = W; tmp.height = H;
const tctx = tmp.getContext('2d');
const src = document.createElement('canvas'); src.width = W; src.height = H;
const sctx = src.getContext('2d');

// ── utils ───────────────────────────────────────────────────
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const P = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;
const E = {
  outCubic: x => 1 - Math.pow(1 - x, 3),
  inCubic: x => x * x * x,
  inOutCubic: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  outExpo: x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x),
  inExpo: x => x <= 0 ? 0 : Math.pow(2, 10 * x - 10),
  inOutExpo: x => x <= 0 ? 0 : x >= 1 ? 1 : x < .5 ? Math.pow(2, 20 * x - 10) / 2 : (2 - Math.pow(2, -20 * x + 10)) / 2,
  outBack: x => { const c1 = 1.70158, c3 = c1 + 1; return x <= 0 ? 0 : 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
  outQuint: x => 1 - Math.pow(1 - x, 5),
};
function rgba(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${n >> 8 & 255},${n & 255},${a})`; }
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash(n) { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
const HEX = '0123456789abcdef', AZ = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ#$%&*';
function scramble(str, p, t, set = HEX, seed = 0) {
  let o = ''; const n = str.length;
  for (let i = 0; i < n; i++) {
    const ch = str[i];
    o += (ch === ' ' || i < p * n) ? ch : set[Math.floor(hash(i * 13.7 + Math.floor(t * 40) + seed) * set.length)];
  }
  return o;
}
function font(c, size, weight = 700, fam = DISP) { c.font = `${weight} ${size}px ${fam}`; }
function txt(c, s, x, y, o = {}) {
  const { size = 40, weight = 700, fam = DISP, color = C.wh, align = 'left', base = 'alphabetic', ls = 0, alpha = 1 } = o;
  c.save(); c.globalAlpha *= alpha; font(c, size, weight, fam); c.fillStyle = color;
  c.textAlign = align; c.textBaseline = base; c.letterSpacing = ls + 'px';
  c.fillText(s, align === 'center' ? x + ls / 2 : x, y); c.restore();
}
function measure(c, s, size, weight = 700, fam = DISP, ls = 0) {
  c.save(); font(c, size, weight, fam); c.letterSpacing = ls + 'px'; const w = c.measureText(s).width; c.restore(); return w;
}
function circle(c, x, y, r) { c.beginPath(); c.arc(x, y, Math.max(0, r), 0, TAU); }
function pill(c, x, y, label, col, o = {}) {
  const { size = 16, scale = 1, alpha = 1, fill = true, textCol = C.bg } = o;
  const w = measure(c, label, size, 700, MONO, 2) + 26, h = size + 16;
  c.save(); c.globalAlpha *= alpha; c.translate(x, y); c.scale(scale, scale);
  c.beginPath(); c.roundRect(-w / 2, -h / 2, w, h, h / 2);
  if (fill) { c.fillStyle = col; c.fill(); } else { c.strokeStyle = col; c.lineWidth = 2; c.stroke(); }
  txt(c, label, 0, 1, { size, fam: MONO, color: fill ? textCol : col, align: 'center', base: 'middle', ls: 2 });
  c.restore();
}
const fmt = n => n.toLocaleString('en-US');

// ── camera helpers ──────────────────────────────────────────
function zoomTo(c, px, py, s, e) { // zoom around point, pulling it toward screen center
  c.translate(lerp(px, 960, e), lerp(py, 540, e)); c.scale(s, s); c.translate(-px, -py);
}

// ── background ──────────────────────────────────────────────
const ACC = [C.or, C.or, C.gr, C.cy, C.vi, C.or];
function drawBG(c, t) {
  c.fillStyle = C.bg; c.fillRect(0, 0, W, H);
  const si = Math.min(5, Math.floor(t / 2.5));
  const gx = 960 + Math.sin(t * 0.6) * 320, gy = 540 + Math.cos(t * 0.45) * 170;
  const blend = (col, a) => { const g = c.createRadialGradient(gx, gy, 0, gx, gy, 1100); g.addColorStop(0, rgba(col, a)); g.addColorStop(1, rgba(col, 0)); c.fillStyle = g; c.fillRect(0, 0, W, H); };
  const w = P(t, si * 2.5 - 0.2, si * 2.5 + 0.3);
  if (si > 0 && w < 1) blend(ACC[si - 1], 0.11 * (1 - w));
  blend(ACC[si], 0.11 * (si > 0 ? w : 1));
  c.fillStyle = 'rgba(238,241,246,0.065)';
  const sp = 48, ox = ((-t * 18) % sp + sp) % sp, oy = ((-t * 9) % sp + sp) % sp;
  for (let x = ox; x < W; x += sp) for (let y = oy; y < H; y += sp) c.fillRect(x, y, 2, 2);
}

// ── shared caption (top-left, kinetic) ──────────────────────
function caption(c, lt, title, sub, accent) {
  const e = E.outExpo(P(lt, 0.12, 0.7));
  c.save();
  c.fillStyle = accent; c.fillRect(140, 146, 64 * e, 4);
  txt(c, '/' + sub.split('·')[0].trim().toUpperCase(), 216, 152, { size: 13, fam: MONO, weight: 400, color: rgba(accent, 0.9 * e), ls: 4 });
  c.beginPath(); c.rect(120, 162, 1100, 92); c.clip();
  txt(c, title, 138, 240 + (1 - e) * 96, { size: 78, weight: 700, ls: -1.5 });
  c.restore();
  const n = Math.floor(sub.length * P(lt, 0.4, 1.0));
  const cursor = n < sub.length || Math.floor(lt * 4) % 2 ? '▍' : '';
  txt(c, sub.slice(0, n) + cursor, 142, 290, { size: 20, fam: MONO, weight: 400, color: rgba(C.wh, 0.58), ls: 1 });
}

// ═════════════ S1 GENESIS (0–2.5) ═════════════
const GENESIS = '000000000019d6689c085ae165831e934ff763ae46a2a6c172b3f1b60a8ce26f';
function S1(c, t) {
  const cx = 960;
  const ex = E.inExpo(P(t, 2.08, 2.5));
  c.save();
  c.translate(960, 540); c.scale(1 + 0.3 * ex, 1 + 0.3 * ex); c.translate(-960, -540);
  for (let i = 0; i < 4; i++) {
    const p = P(t, 0.12 + i * 0.26, 1.3 + i * 0.26); if (p <= 0 || p >= 1) continue;
    c.strokeStyle = rgba(C.or, (1 - p) * 0.55); c.lineWidth = 2;
    circle(c, cx, 540, 18 + 560 * E.outCubic(p)); c.stroke();
  }
  const pd = E.outBack(P(t, 0.02, 0.42));
  const pl = E.outExpo(P(t, 0.52, 1.0));
  const lineY = lerp(540, 578, E.inOutCubic(P(t, 0.95, 1.35)));
  const w = Math.max(32 * pd, lerp(32, 1380, pl)), h = lerp(32 * pd, 3, pl);
  c.save(); c.shadowColor = C.or; c.shadowBlur = 40 * (1 - pl * 0.6);
  c.fillStyle = C.or; c.beginPath(); c.roundRect(cx - w / 2, lineY - h / 2, w, h, h / 2); c.fill(); c.restore();

  const ha = P(t, 0.6, 0.9);
  txt(c, 'GENESIS  ·  2009-01-03  ·  NONCE 2083236893', cx, 326, { size: 14, fam: MONO, weight: 400, color: rgba(C.wh, 0.45), align: 'center', ls: 5, alpha: ha });
  txt(c, scramble(GENESIS, P(t, 0.7, 1.55), t), cx, 366, { size: 21, fam: MONO, weight: 400, color: rgba(C.cy, 0.75), align: 'center', ls: 3, alpha: ha });

  const words = [['PROOF', C.wh], ['OF', rgba(C.wh, 0.42)], ['WORK', C.or]];
  const size = 172, gap = 42;
  const ws = words.map(([s]) => measure(c, s, size, 700, DISP, -3));
  let x = cx - (ws.reduce((a, b) => a + b, 0) + gap * 2) / 2;
  c.save(); c.beginPath(); c.rect(0, 0, W, lineY - 4); c.clip();
  words.forEach(([s, col], i) => {
    const e = E.outExpo(P(t, 0.98 + i * 0.09, 1.6 + i * 0.09));
    txt(c, s, x, lineY - 26 + (1 - e) * 210, { size, color: col, ls: -3 });
    x += ws[i] + gap;
  });
  c.restore();
  const se = E.outExpo(P(t, 1.3, 2.0));
  txt(c, 'MOTION REEL  —  2026', cx, 640, { size: 24, fam: MONO, weight: 400, align: 'center', ls: lerp(44, 14, se), alpha: se, color: rgba(C.wh, 0.8) });
  c.restore();
  if (ex > 0) { c.fillStyle = C.or; circle(c, 960, 540, 1250 * ex); c.fill(); }
}

// ═════════════ S2 ON-CHAIN (2.5–5.0) ═════════════
const S2P = (() => { const r = mulberry(7), a = []; for (let i = 0; i < 150; i++) a.push({ x0: 1470 + r() * 420, y0: 250 + r() * 600, s: 4 + r() * 9, fee: r(), ph: r() * TAU, ta: 0.28 + (i / 150) * 0.85 + r() * 0.05, tx: r(), ty: r() }); return a; })();
const BLK = 180, DEP = 36, PITCH = 270, BY = 450;
function cube(c, x, y, s, d, o = {}) {
  const { face = '#0c1016', top = '#141a23', side = '#090c11', edge = C.or, ea = 1, lw = 2, dash = null } = o;
  c.save(); c.lineJoin = 'round';
  c.beginPath(); c.moveTo(x, y); c.lineTo(x + d, y - d); c.lineTo(x + s + d, y - d); c.lineTo(x + s, y); c.closePath(); c.fillStyle = top; c.fill();
  c.beginPath(); c.moveTo(x + s, y); c.lineTo(x + s + d, y - d); c.lineTo(x + s + d, y + s - d); c.lineTo(x + s, y + s); c.closePath(); c.fillStyle = side; c.fill();
  c.fillStyle = face; c.fillRect(x, y, s, s);
  c.globalAlpha *= ea; c.strokeStyle = edge; c.lineWidth = lw; if (dash) c.setLineDash(dash);
  c.beginPath(); c.rect(x, y, s, s);
  c.moveTo(x, y); c.lineTo(x + d, y - d); c.lineTo(x + s + d, y - d); c.lineTo(x + s + d, y + s - d); c.lineTo(x + s, y + s);
  c.moveTo(x + s, y); c.lineTo(x + s + d, y - d); c.stroke();
  c.restore();
}
function packed(c, x, y, s, fill, seed, alpha = 1) { // tx squares packed in a block
  const n = 9, cell = (s - 24) / n;
  for (let i = 0; i < n * n; i++) {
    const col = i % n, row = n - 1 - Math.floor(i / n);
    if ((Math.floor(i / n) + 1) / n > fill + 1e-6) continue;
    const hv = hash(i + seed * 97);
    c.fillStyle = hv > 0.72 ? rgba(C.or, 0.85 * alpha) : hv > 0.35 ? rgba(C.or, 0.4 * alpha) : rgba(C.cy, 0.28 * alpha);
    c.fillRect(x + 12 + col * cell + 1.5, y + 12 + row * cell + 1.5, cell - 3, cell - 3);
  }
}
function S2(c, lt) {
  const drift = lt * 22, slide = PITCH * E.outExpo(P(lt, 1.7, 2.12));
  const bx = j => 1180 + j * PITCH - slide - drift;
  const mined = lt >= 1.55;
  const zx = bx(0) + BLK / 2, zy = BY + BLK / 2;
  const ze = E.inExpo(P(lt, 2.08, 2.5));
  c.save();
  if (ze > 0) zoomTo(c, zx, zy, 1 + 60 * ze, clamp(ze * 3));

  // links
  c.save(); c.strokeStyle = rgba(C.or, 0.5); c.lineWidth = 2; c.setLineDash([8, 8]); c.lineDashOffset = -lt * 60;
  for (let j = -5; j < 0; j++) { const x = bx(j); c.beginPath(); c.moveTo(x + BLK + DEP / 2, BY + BLK / 2 - DEP / 2); c.lineTo(bx(j + 1), BY + BLK / 2); c.stroke(); }
  c.restore();

  for (let j = -5; j <= 1; j++) {
    const x = bx(j); if (x > W + 100 || x < -300) continue;
    const k = j + 5, ep = P(lt, 0.02 + k * 0.06, 0.55 + k * 0.06), e = E.outBack(ep);
    const y = BY - (1 - e) * 520;
    c.save(); c.globalAlpha = clamp(ep * 3);
    if (j < 0) {
      cube(c, x, y, BLK, DEP, { ea: 0.9 });
      packed(c, x, y, BLK, 1, j + 10, 0.9);
      txt(c, '#' + fmt(967422 + j), x, y - DEP - 18, { size: 20, fam: MONO, weight: 700, color: rgba(C.wh, 0.75) });
      txt(c, '0000…' + GENESIS.slice(8 + k * 3, 12 + k * 3), x, y + BLK + 34, { size: 16, fam: MONO, weight: 400, color: rgba(C.wh, 0.4) });
    } else if (j === 0) {
      const fill = E.outCubic(P(lt, 0.3, 1.52));
      cube(c, x, y, BLK, DEP, { edge: mined ? C.or : C.wh, ea: mined ? 1 : 0.55, dash: mined ? null : [10, 7], lw: mined ? 3 : 2 });
      packed(c, x, y, BLK, fill, 3, 1);
      if (mined) {
        const fl = 1 - P(lt, 1.55, 1.85);
        c.save(); c.shadowColor = C.or; c.shadowBlur = 60 * fl + 12; c.strokeStyle = C.or; c.lineWidth = 3; c.strokeRect(x, y, BLK, BLK); c.restore();
        c.fillStyle = rgba('#ffffff', 0.85 * fl * fl); c.fillRect(x, y, BLK, BLK);
      }
      txt(c, '#' + fmt(967422), x, y - DEP - 18, { size: 20, fam: MONO, color: mined ? C.or : rgba(C.wh, 0.75) });
      const hs = mined ? scramble('00000000000000000001f3a9', P(lt, 1.55, 1.95), lt, HEX, 5) : 'nonce 0x' + scramble('ffffffff', 0, lt * 3, HEX, 9);
      txt(c, hs.length > 20 ? hs.slice(0, 4) + '…' + hs.slice(-6) : hs, x, y + BLK + 34, { size: 16, fam: MONO, weight: 400, color: mined ? rgba(C.or, 0.9) : rgba(C.cy, 0.85) });
    } else {
      c.globalAlpha = P(lt, 1.8, 2.1) * 0.6;
      cube(c, x, BY, BLK, DEP, { edge: C.wh, ea: 0.5, dash: [10, 7], face: 'rgba(0,0,0,0)', top: 'rgba(0,0,0,0)', side: 'rgba(0,0,0,0)' });
    }
    c.restore();
  }
  // shockwave + badge
  if (mined) {
    const p = P(lt, 1.55, 2.15);
    if (p < 1) { c.strokeStyle = rgba(C.or, 1 - p); c.lineWidth = 3 * (1 - p) + 1; circle(c, bx(0) + BLK / 2, BY + BLK / 2, 90 + 520 * E.outCubic(p)); c.stroke(); }
    const bp = P(lt, 1.58, 1.95);
    pill(c, bx(0) + BLK / 2 + DEP / 2, BY - DEP - 72, 'BLOCK FOUND', C.or, { scale: E.outBack(bp), alpha: clamp(bp * 4) });
  }
  // mempool particles
  const ma = P(lt, 0.05, 0.4);
  for (const p of S2P) {
    if (lt > p.ta + 0.35) continue;
    let x = p.x0 - lt * 30 + Math.sin(lt * 2 + p.ph) * 6, y = p.y0 + Math.cos(lt * 1.7 + p.ph) * 8, s = p.s;
    const k = E.inCubic(P(lt, p.ta, p.ta + 0.35));
    if (k > 0) {
      const tx = bx(0) + 18 + p.tx * (BLK - 36), ty = BY + 18 + p.ty * (BLK - 36);
      x = lerp(x, tx, k); y = lerp(y, ty, k) - Math.sin(k * Math.PI) * 90; s *= 1 - 0.5 * k;
    }
    c.fillStyle = p.fee > 0.72 ? rgba(C.or, ma) : p.fee > 0.4 ? rgba(C.wh, 0.7 * ma) : rgba(C.cy, 0.8 * ma);
    c.fillRect(x - s / 2, y - s / 2, s, s);
  }
  const left = S2P.filter(p => lt < p.ta + 0.35).length;
  txt(c, 'MEMPOOL', 1680, 232, { size: 14, fam: MONO, weight: 700, color: rgba(C.wh, 0.55 * ma), ls: 6 });
  txt(c, `${fmt(4800 + left * 31)} tx · ${(11 + left / 20).toFixed(1)} sat/vB`, 1680, 258, { size: 14, fam: MONO, weight: 400, color: rgba(C.cy, 0.75 * ma), ls: 1 });
  caption(c, lt, 'ON-CHAIN', 'bitcoin · mempool → block · node tooling & bitcoin-mcp', C.or);
  c.restore();
  // iris reveal from S1
  if (lt < 0.5) {
    const r = 1300 * E.outExpo(P(lt, 0, 0.5));
    c.fillStyle = C.or; c.beginPath(); c.rect(0, 0, W, H); c.arc(960, 540, r, 0, TAU); c.fill('evenodd');
    c.strokeStyle = rgba('#ffffff', 0.9 * (1 - P(lt, 0, 0.5))); c.lineWidth = 3; circle(c, 960, 540, r); c.stroke();
  }
}

// ═════════════ S3 WHALE FLOW (5.0–7.5) ═════════════
const CAND = (() => { const r = mulberry(21), a = []; let p = 100; for (let i = 0; i < 44; i++) { const o = p, cl = o + (r() - 0.44) * 3.2; a.push({ o, c: cl, h: Math.max(o, cl) + r() * 1.4, l: Math.min(o, cl) - r() * 1.4 }); p = cl; } return a; })();
const CMIN = Math.min(...CAND.map(k => k.l)), CMAX = Math.max(...CAND.map(k => k.h));
const CX0 = 150, CX1 = 1340, CY0 = 380, CY1 = 850;
const cyv = v => lerp(CY1, CY0, (v - CMIN) / (CMAX - CMIN));
const cxi = i => CX0 + 14 + i * ((CX1 - CX0 - 28) / 43);
const cti = i => 0.08 + i * 0.03;
const WHALES = [
  { i: 7, tk: 'NVDA', k: '1000C', prem: 4.2, ty: 'SWEEP', call: true },
  { i: 14, tk: 'SPY', k: '580P 0DTE', prem: 2.7, ty: 'BLOCK', call: false },

  const segs = [[[x, y], [x + sz, y]], [[x + sz, y], [x + sz, y + sz]], [[x + sz, y + sz], [x, y + sz]], [[x, y + sz], [x, y]], [[x, y], [x + d, y - d]], [[x + d, y - d], [x + sz + d, y - d]], [[x + sz, y], [x + sz + d, y - d]], [[x + sz + d, y - d], [x + sz + d, y + sz - d]], [[x + sz + d, y + sz - d], [x + sz, y + sz]]];
  c.save(); c.strokeStyle = C.or; c.lineWidth = 4; c.lineCap = 'round'; c.shadowColor = C.or; c.shadowBlur = 16;
  segs.forEach(([a, b], i) => { const p = E.outCubic(P(lt, 0.45 + i * 0.035, 0.75 + i * 0.035)); if (p <= 0) return; c.beginPath(); c.moveTo(a[0], a[1]); c.lineTo(lerp(a[0], b[0], p), lerp(a[1], b[1], p)); c.stroke(); });
  c.restore();

  tg.forEach(([s, col], i) => { const p = E.outExpo(P(lt, 1.1 + i * 0.06, 1.55 + i * 0.06)); txt(c, s, tx, 725 + (1 - p) * 24, { size: tsz, weight: 400, fam: MONO, color: col, ls: tls, alpha: p }); tx += tws[i] + gap; });
  // divider

  const url = 'github.com/Bortlesboat', n = Math.floor(url.length * P(lt, 1.5, 1.95));
  if (lt > 1.45) {
    txt(c, '→', 960 - measure(c, url, 26, 700, MONO, 1) / 2 - 20, 840, { size: 26, fam: MONO, color: C.or, align: 'right' });
    txt(c, url.slice(0, n), 960 - measure(c, url, 26, 700, MONO, 1) / 2, 840, { size: 26, fam: MONO, color: C.wh, ls: 1 });
    if (n < url.length || Math.floor(lt * 3.5) % 2) { const cw = measure(c, url.slice(0, n), 26, 700, MONO, 1); c.fillStyle = C.or; c.fillRect(960 - measure(c, url, 26, 700, MONO, 1) / 2 + cw + 3, 818, 13, 28); }

}

// ── transitions & post ──────────────────────────────────────
function streaks(c, t) {
  const g = 1 - Math.abs(t - 7.5) / 0.3; if (g <= 0) return;
  for (let i = 0; i < 26; i++) {
    const y = hash(i * 3.1) * H, len = 300 + hash(i * 5.7) * 900, x = ((hash(i) * 3000 - t * 9000) % 3000 + 3000) % 3000 - 600;
    c.fillStyle = rgba(i % 5 === 0 ? C.cy : C.wh, 0.35 * g * hash(i * 9.3)); c.fillRect(x, y, len, 1 + hash(i * 2.2) * 2);
  }
}
function scene(c, t) {
  drawBG(c, t);
  if (t < 2.5) S1(c, t); else if (t < 5) S2(c, t - 2.5); else if (t < 7.5) S3(c, t - 5);
  else if (t < 10) S4(c, t - 7.5); else if (t < 12.5) S5(c, t - 10); else S6(c, t - 12.5);
  streaks(c, t);
}
// grain + vignette assets
const NOISE = [0, 1, 2].map(k => { const n = document.createElement('canvas'); n.width = n.height = 256; const x = n.getContext('2d'), d = x.createImageData(256, 256), r = mulberry(99 + k); for (let i = 0; i < d.data.length; i += 4) { const v = r() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; } x.putImageData(d, 0, 0); return n; });
const VIG = (() => { const v = document.createElement('canvas'); v.width = W; v.height = H; const x = v.getContext('2d'), g = x.createRadialGradient(960, 540, 300, 960, 540, 1150); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.6)'); x.fillStyle = g; x.fillRect(0, 0, W, H); return v; })();
function post(c, t, f) {
  // glitch at the FP&A → OSS cut
  const g = clamp(1 - Math.abs(t - 10) / 0.14);
  if (g > 0) {
    sctx.drawImage(cv, 0, 0);                       // clean source copy
    const dx = 22 * g, split = col => { tctx.globalCompositeOperation = 'source-over'; tctx.drawImage(src, 0, 0); tctx.globalCompositeOperation = 'multiply'; tctx.fillStyle = col; tctx.fillRect(0, 0, W, H); };
    c.fillStyle = '#000'; c.fillRect(0, 0, W, H);
    c.globalCompositeOperation = 'lighter';
    split('#ff0000'); c.drawImage(tmp, -dx, 0);
    split('#00ffff'); c.drawImage(tmp, dx, 0);
    c.globalCompositeOperation = 'source-over'; tctx.globalCompositeOperation = 'source-over';
    const seed = Math.floor(t * 30);
    for (let i = 0; i < 9; i++) {
      const y = hash(seed * 11 + i) * H, h = 10 + hash(seed * 7 + i) * 70, off = (hash(seed * 3 + i) - 0.5) * 180 * g;
      c.drawImage(src, 0, y, W, h, off, y, W, h);
      if (i % 3 === 0) { c.fillStyle = rgba([C.cy, C.vi, C.or][i / 3], 0.5 * g); c.fillRect(hash(seed + i) * W, y, 80 + hash(i + seed * 2) * 400, 3 + h * 0.1); }
    }
  }
  c.save(); c.globalCompositeOperation = 'overlay'; c.globalAlpha = 0.09;
  c.fillStyle = c.createPattern(NOISE[f % 3], 'repeat');
  c.translate((hash(f) * 256) | 0, (hash(f + 0.5) * 256) | 0); c.fillRect(-256, -256, W + 256, H + 256); c.restore();
  c.drawImage(VIG, 0, 0);
}
const NAMES = ['GENESIS', 'ON-CHAIN', 'WHALE FLOW', 'FP&A', 'OPEN SOURCE', 'SIGNATURE'];
const pad = n => String(n).padStart(2, '0');
function hud(c, t) {
  const a = P(t, 0.15, 0.6);
  c.save(); c.globalAlpha = a;
  c.strokeStyle = 'rgba(238,241,246,0.35)'; c.lineWidth = 2;
  const m = 56, L = 30;
  [[m, m, 1, 1], [W - m, m, -1, 1], [m, H - m, 1, -1], [W - m, H - m, -1, -1]].forEach(([x, y, sx, sy]) => { c.beginPath(); c.moveTo(x + L * sx, y); c.lineTo(x, y); c.lineTo(x, y + L * sy); c.stroke(); });
  txt(c, 'BORTLESBOAT · REEL 2026', 92, 86, { size: 14, fam: MONO, weight: 700, color: rgba(C.wh, 0.7), ls: 4 });
  // section slot-roll
  const si = Math.min(5, Math.floor(t / 2.5)), rp = E.outExpo(P(t, si * 2.5, si * 2.5 + 0.4));
  c.save(); c.beginPath(); c.rect(1300, 64, 540, 30); c.clip();
  const lab = i => `${pad(i + 1)} / 06   ${NAMES[i]}`;
  if (si > 0 && rp < 1) txt(c, lab(si - 1), 1828, 86 - rp * 30, { size: 14, fam: MONO, weight: 700, color: rgba(C.wh, 0.7), align: 'right', ls: 4 });
  txt(c, lab(si), 1828, 86 + (si > 0 ? (1 - rp) * 30 : 0), { size: 14, fam: MONO, weight: 700, color: rgba(C.wh, 0.7), align: 'right', ls: 4 });
  c.restore();
  const f = Math.round(t * FPS);
  txt(c, `TC 00:00:${pad(Math.floor(f / FPS))}:${pad(f % FPS)}`, 92, 1004, { size: 14, fam: MONO, weight: 400, color: rgba(C.wh, 0.55), ls: 3 });
  txt(c, '1920×1080 · 60FPS · 100% CODE-RENDERED', 1828, 1004, { size: 14, fam: MONO, weight: 400, color: rgba(C.wh, 0.55), align: 'right', ls: 3 });
  c.fillStyle = rgba(C.wh, 0.1); c.fillRect(92, 1030, W - 184, 2);
  c.fillStyle = C.or; c.fillRect(92, 1030, (W - 184) * clamp(t / DUR), 2);
  for (let k = 1; k < 6; k++) { c.fillStyle = rgba(C.wh, 0.4); c.fillRect(92 + (W - 184) * k / 6 - 1, 1026, 2, 10); }
  c.restore();
}

// ── drivers ─────────────────────────────────────────────────
function renderFrame(f) {
  const t = f / FPS;
  out.globalCompositeOperation = 'source-over';
  for (let k = 0; k < SUB; k++) {
    const tk = clamp(t + (SUB > 1 ? (k / (SUB - 1) - 0.5) : 0) * SHUTTER, 0, DUR - 1e-4);
    bctx.save(); bctx.setTransform(1, 0, 0, 1, 0, 0); scene(bctx, tk); bctx.restore();
    out.globalAlpha = 1 / (k + 1); out.drawImage(buf, 0, 0);

window.renderFrame = renderFrame;
window.TOTAL = DUR * FPS;
document.fonts.load(`700 40px 'Space Grotesk'`).then(() => document.fonts.load(`400 20px 'JetBrains Mono'`)).then(() => document.fonts.load(`700 20px 'JetBrains Mono'`)).finally(() => {
  window.READY = true;
  if (RENDER) { renderFrame(0); return; }
  // live playback: loops with a short hold on the signature frame
  const HOLD = 1.4, CYCLE = DUR + HOLD;
  const debug = new URLSearchParams(location.search).has('debug');
  const fpsEl = document.getElementById('fps'); if (debug) fpsEl.style.display = 'block';
  const toggleBtn = document.getElementById('toggle');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let clock = reduced ? 1.95 : 0, playing = !reduced, last = performance.now();
  const times = [];
  const setPlaying = p => { playing = p; toggleBtn.textContent = p ? 'Pause' : 'Play'; toggleBtn.setAttribute('aria-pressed', String(!p)); };
  setPlaying(playing);
  toggleBtn.onclick = () => setPlaying(!playing);
  cv.onclick = () => setPlaying(!playing);
  document.getElementById('replay').onclick = () => { clock = 0; setPlaying(true); };
  addEventListener('keydown', e => {
    if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); setPlaying(!playing); }
    if (e.key === 'r' || e.key === 'R') { clock = 0; setPlaying(true); }
  });
  document.addEventListener('visibilitychange', () => { last = performance.now(); });
  let idleTimer; const wake = () => { document.body.classList.remove('idle'); clearTimeout(idleTimer); idleTimer = setTimeout(() => playing && document.body.classList.add('idle'), 2200); };
  ['mousemove', 'touchstart', 'keydown', 'focusin'].forEach(ev => addEventListener(ev, wake, { passive: true })); wake();
  (function loop(now) {
    const dt = clamp(now - last, 0, 100); last = now;
    if (playing) clock = (clock + dt / 1000) % CYCLE;
    renderFrame(clamp(Math.floor(clock * FPS), 0, DUR * FPS - 1));
    if (debug) {
      times.push(dt); if (times.length > 600) times.shift();
      const s = [...times].sort((a, b) => a - b), p999 = s[Math.floor(s.length * 0.999)] || 0;
      fpsEl.textContent = `${(1000 / (times.reduce((a, b) => a + b, 0) / times.length)).toFixed(0)} fps · p99.9 ${p999.toFixed(1)}ms`;
    }
    requestAnimationFrame(loop);
  })(last);
});
